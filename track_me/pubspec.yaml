name: track_me
description: "UrDay - AI-Powered Productivity App"
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # HTTP Client
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Authentication
  google_sign_in: ^6.2.1

  # UI / Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8

  # Utilities
  intl: ^0.19.0
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  package_info_plus: ^8.1.0
  home_widget: ^0.9.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
